<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steri-app | Evidencija Prijema i Izdavanja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- ZAGLAVLJE -->
  <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide">Steri-app</h1>
    <button id="btn-logout" class="hidden bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
      Odjava
    </button>
  </header>

  <main class="flex-grow container mx-auto p-4 max-w-lg flex flex-col justify-center">

    <!-- EKRAN 1: PRIJAVA -->
    <div id="auth-container" class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 space-y-4">
      <h2 id="auth-title" class="text-2xl font-bold text-center text-blue-600">Prijava u sustav</h2>
      
      <div id="reg-fields" class="hidden space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Ime i prezime</label>
          <input type="text" id="auth-name" placeholder="npr. Ana Anić" class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail adresa</label>
        <input type="email" id="auth-email" placeholder="vas.email@primjer.com" class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Lozinka</label>
        <input type="password" id="auth-password" placeholder="••••••••" class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <button id="btn-auth-action" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition">
        Prijavi se
      </button>

      <div class="text-center text-sm text-gray-600 pt-2">
        <span id="auth-toggle-text">Nemate račun?</span>
        <button id="auth-toggle-link" class="text-blue-600 font-bold ml-1 hover:underline focus:outline-none">
          Registrirajte se
        </button>
      </div>
    </div>

    <!-- EKRAN 2: ČEKANJE ODOBRENJA -->
    <div id="pending-container" class="hidden bg-white p-6 rounded-xl shadow-lg border border-yellow-200 text-center space-y-4">
      <div class="text-yellow-500 mx-auto w-16 h-16 flex items-center justify-center bg-yellow-100 rounded-full">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <h2 class="text-xl font-bold text-gray-800">Račun čeka odobrenje</h2>
      <p class="text-gray-600 text-sm">Zahtjev je poslan. Administrator mora odobriti Vaš račun.</p>
    </div>

    <!-- EKRAN 3: GLAVNA APLIKACIJA -->
    <div id="app-container" class="hidden space-y-6">

      <!-- IZBOR: PRIJEM ILI IZDAVANJE -->
      <div id="step-main-choice" class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 text-center space-y-4">
        <h2 class="text-xl font-bold text-gray-800">Odaberite evidenciju</h2>
        <div class="grid grid-cols-2 gap-4">
          <button id="btn-prijem" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg transition flex flex-col items-center justify-center gap-1">
            <span class="text-2xl">📥</span> PRIJEM
          </button>
          <button id="btn-izdavanje" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg transition flex flex-col items-center justify-center gap-1">
            <span class="text-2xl">📤</span> IZDAVANJE
          </button>
        </div>
      </div>

      <!-- FORMULAR UNOSA -->
      <div id="step-form" class="hidden bg-white p-6 rounded-xl shadow-lg border border-gray-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="text-lg font-bold text-gray-800">Unos - <span id="form-type-label"></span></h3>
          <span id="badge-evidencija-type" class="px-3 py-1 rounded-full text-xs font-bold text-white"></span>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Kategorija odjela</label>
          <select id="form-category" class="w-full mt-1 p-2.5 border rounded-lg bg-gray-50 font-medium">
            <option value="Kirurgija">Kirurgija</option>
            <option value="Ginekologija">Ginekologija</option>
            <option value="Interna">Interna</option>
            <option value="Vanjski odjeli">Vanjski odjeli</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Odjel / Ambulanta</label>
          <select id="form-department" class="w-full mt-1 p-2.5 border rounded-lg bg-gray-50 font-medium"></select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Instrument / Grupa</label>
          <select id="form-instrument-group" class="w-full mt-1 p-2.5 border rounded-lg bg-gray-50 font-medium">
            <option value="Pincete">Pincete (Anatomska, Kirurška, Ušna)</option>
            <option value="Škare">Škare (Škare, Škare za zavoj)</option>
            <option value="Pean">Pean</option>
            <option value="Iglodržač">Iglodržač</option>
            <option value="Chohlea">Chohlea</option>
            <option value="Stapler">Stapler</option>
            <option value="Sonde">Sonde (Glavičasta, Žlijebasta, Urološke)</option>
            <option value="Kliješta">Kliješta (Luer, Magillova)</option>
            <option value="Boce">Boce (V. boca, M. boca, Sauger, O2)</option>
            <option value="Maske i Dišni sustav">Maske i Dišni sustav (Maska O2, Lar maska, Airway...)</option>
            <option value="Crijeva">Crijeva (Respirator, Julijan)</option>
            <option value="Ostali instrumenti">Ostali instrumenti (Bubrežasta, Hvatalica, Prst kuka...)</option>
            <option value="Setovi (Narudžba)">Setovi / Narudžba (MSBI, SBI, UK, HK)</option>
          </select>
        </div>

        <div id="subgroup-container" class="hidden">
          <label class="block text-sm font-medium text-gray-700">Podvrsta / Detalj</label>
          <select id="form-instrument-sub" class="w-full mt-1 p-2.5 border rounded-lg bg-gray-50 font-medium"></select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Količina (kom/set)</label>
          <input type="number" id="form-qty" value="1" min="1" class="w-full mt-1 p-2.5 border rounded-lg font-bold text-lg text-center">
        </div>

        <div class="pt-4 border-t flex space-x-2">
          <button id="btn-save-form" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow">
            Spremi
          </button>
          <button id="btn-cancel-form" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-3 rounded-lg">
            Odustani
          </button>
        </div>
      </div>

    </div>

  </main>

  <footer class="text-center p-4 text-xs text-gray-500 border-t bg-white">
    Steri-app &copy; 2026.
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8M5d_HsX_37ZO2OGnvZvBK-TdzKzPFdk",
      authDomain: "steriapp-ecbf9.firebaseapp.com",
      projectId: "steriapp-ecbf9",
      storageBucket: "steriapp-ecbf9.firebasestorage.app",
      messagingSenderId: "840912460762",
      appId: "1:840912460762:web:0c5077e39e3b371430bee3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentType = "PRIJEM";

    const departmentsData = {
      "Kirurgija": ["Abdomen (ABD)", "Dječja kirurgija", "Dječja ambulanta", "JIL", "Opća ambulanta", "ORL ambulanta", "ORL odjel", "Ortopedska ambulanta", "Traumatološki odjel", "Traumatološka ambulanta", "Urološka ambulanta", "Urološki odjel", "Vaskularna"],
      "Ginekologija": ["Gin. odjel", "Novorođenački", "Rađaona", "Rodilište", "UZV"],
      "Interna": ["Int 1 (kardio)", "Int 2b (gastro)", "Int 2a (endokrina)", "Int 3 (nefro)", "Int 4 (pojačana skrb)", "Gastroskopija", "Infektologija"],
      "Vanjski odjeli": ["Citologija", "EMNG", "Hemodijaliza", "KVD", "Laboratorij", "Ljekarna", "Neurologija", "Očna ambulanta", "Očni odjel", "OHBP ORL", "OHBP-HKA", "OHBP-SALA", "Pedijatrija", "Produženo", "Pulmologija", "Pulmološka ambulanta", "RTG"]
    };

    const subgroupsData = {
      "Pincete": ["Anatomska pinceta", "Kirurška pinceta", "Ušna pinceta"],
      "Škare": ["Škare", "Škare za zavoj"],
      "Sonde": ["Glavičasta sonda", "Žlijebasta sonda", "Urološke sonde"],
      "Kliješta": ["Kliješta Luer", "Magillova kliješta"],
      "Boce": ["V. boca + čep", "M. boca + čep", "Boce sauger", "Boce O2"],
      "Maske i Dišni sustav": ["Maska O2", "Lar maska", "Airway", "Nazofar tubus"],
      "Crijeva": ["Crijeva za respirator", "Julijan crijeva"],
      "Ostali instrumenti": ["Bubrežasta", "Hvatalica", "Prst kuka", "Špatula", "Drška skalpel", "Sauger", "Dijelovi vac pumpe", "Vodilica"],
      "Setovi (Narudžba)": ["Set MSBI", "Set SBI", "Set UK", "Set HK"]
    };

    document.getElementById('btn-prijem').onclick = () => openForm("PRIJEM");
    document.getElementById('btn-izdavanje').onclick = () => openForm("IZDAVANJE");
    document.getElementById('btn-cancel-form').onclick = resetMain;

    document.getElementById('form-category').onchange = (e) => updateDepartments(e.target.value);
    document.getElementById('form-instrument-group').onchange = (e) => updateSubgroups(e.target.value);

    function openForm(type) {
      currentType = type;
      document.getElementById('step-main-choice').classList.add('hidden');
      document.getElementById('step-form').classList.remove('hidden');
      document.getElementById('form-type-label').textContent = type;
      
      const badge = document.getElementById('badge-evidencija-type');
      badge.textContent = type;
      badge.className = type === "PRIJEM" ? "px-3 py-1 rounded-full text-xs font-bold bg-green-600 text-white" : "px-3 py-1 rounded-full text-xs font-bold bg-red-600 text-white";

      updateDepartments("Kirurgija");
      updateSubgroups("Pincete");
    }

    function updateDepartments(cat) {
      const deptSelect = document.getElementById('form-department');
      deptSelect.innerHTML = "";
      departmentsData[cat].forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        deptSelect.appendChild(opt);
      });
    }

    function updateSubgroups(group) {
      const subContainer = document.getElementById('subgroup-container');
      const subSelect = document.getElementById('form-instrument-sub');
      
      if (subgroupsData[group]) {
        subContainer.classList.remove('hidden');
        subSelect.innerHTML = "";
        subgroupsData[group].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subSelect.appendChild(opt);
        });
      } else {
        subContainer.classList.add('hidden');
      }
    }

    document.getElementById('btn-save-form').onclick = async () => {
      const group = document.getElementById('form-instrument-group').value;
      const subContainer = document.getElementById('subgroup-container');
      const itemDetail = subContainer.classList.contains('hidden') ? group : document.getElementById('form-instrument-sub').value;
      const qty = parseInt(document.getElementById('form-qty').value) || 1;

      try {
        await addDoc(collection(db, currentType === "PRIJEM" ? "prijem_evidencija" : "izdavanje_evidencija"), {
          vrsta: currentType,
          kategorija: document.getElementById('form-category').value,
          odjel: document.getElementById('form-department').value,
          instrument: itemDetail,
          kolicina: qty,
          operaterEmail: currentUser.email,
          datum: serverTimestamp()
        });
        alert("Spremljeno!");
        resetMain();
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };

    function resetMain() {
      document.getElementById('step-main-choice').classList.remove('hidden');
      document.getElementById('step-form').classList.add('hidden');
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        document.getElementById('btn-logout').classList.remove('hidden');
      } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('btn-logout').classList.add('hidden');
      }
    });

    document.getElementById('btn-auth-action').onclick = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert(e.message);
      }
    };

    document.getElementById('btn-logout').onclick = () => signOut(auth);
  </script>
</body>
</html>
